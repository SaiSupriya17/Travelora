    <link rel="stylesheet" href="style.css">

    <style>

        /* ==============================
           DETAILS PAGE
        ============================== */

        .destination-details-page {
            width: 100%;
            padding: 50px 7%;
            box-sizing: border-box;
        }

        .details-container {
            max-width: 1200px;
            margin: auto;
        }

        .details-title {
            text-align: center;
            font-size: 45px;
            color: #0b4f75;
            margin-bottom: 12px;
        }

        .details-intro {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 35px;
            font-size: 18px;
            line-height: 1.7;
            color: #526b80;
        }

        .main-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 22px;
            display: block;
            margin-bottom: 45px;
        }

        .details-section {
            margin-bottom: 50px;
        }

        .details-section h2 {
            color: #0b4f75;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .details-section > p {
            font-size: 17px;
            line-height: 1.8;
            color: #526b80;
        }

        /* Cards */

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .details-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .details-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .details-card-content {
            padding: 20px;
        }

        .details-card h3 {
            color: #0b4f75;
            margin: 0 0 10px;
            font-size: 22px;
        }

        .details-card p {
            color: #526b80;
            line-height: 1.6;
            margin: 0;
        }

        /* Experience list */

        .experience-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0;
            list-style: none;
        }

        .experience-list li {
            background: #f2f8fb;
            padding: 17px 20px;
            border-radius: 12px;
            font-size: 17px;
            color: #164b68;
        }

        /* Back button */

        .back-button {
            display: inline-block;
            padding: 13px 25px;
            background: #0b4f75;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        .back-button:hover {
            background: #083b58;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .destination-details-page {
                padding: 35px 5%;
            }

            .details-title {
                font-size: 34px;
            }

            .main-image {
                height: 300px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .experience-list {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

/* =====================================================
   GET PLACE FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const requestedPlace =
    params.get("place");


/*
   If someone opens this page without a place,
   send them back to Home instead of showing
   some random destination.
*/

if (
    !requestedPlace ||
    !destinationData[
        requestedPlace.toLowerCase()
    ]
) {

    window.location.href =
        "index.html";

}


/* =====================================================
   GET SELECTED DESTINATION
===================================================== */

const place =
    requestedPlace.toLowerCase();

const data =
    destinationData[place];



/* =====================================================
   BASIC INFORMATION
===================================================== */

    "placeName"
).textContent =
    data.name;


document.getElementById(
    "placeIntro"
).textContent =
    data.intro;


document.getElementById(
    "mainImage"
).src =
    data.mainImage;


document.getElementById(
    "mainImage"
).alt =
    data.name;

===================================================== */

    );

    function(placeItem) {

                    alt="${placeItem.name}"

                        ${foodItem.name}
                    </h3>

                    <p>
                        ${foodItem.text}
                    </p>

                </div>

            </div>

        `;

    }
);
