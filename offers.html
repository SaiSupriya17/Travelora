            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .offer-box {

            letter-spacing: 1.5px;
            color: #7b8b96;
            margin-bottom: 8px;
        }

            color: #073f60;

        }

            font-size: 11px;
            font-weight: bold;

        .active {

            color: #073f60;
            font-size: 13px;
            margin-bottom: 10px;

            color: #667788;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .coupon-box {
            background: #f8fafc;
            border: 1px dashed #9db0bd;
            border-radius: 9px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #073f60;
        }

        .coupon-box b {
            color: #ff7300;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .offer-box button {
            width: 100%;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            background: #ff7300;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        }

            background: #073f60;
        }

        .offer-box button:disabled {
            background: #b8c0c5;
            cursor: not-allowed;
        }

        .extra-offer {
            grid-column: span 3;
            background: linear-gradient(135deg, #073f60, #087f8c);
            color: white;
            border-top: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px;

        .extra-offer h2 {

        }

            color: rgba(255,255,255,0.9);

        }

            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            background: #073f60;
            color: white;
            padding: 13px 20px;
            border-radius: 10px;
            display: none;
            z-index: 9999;
            max-width: 90%;
            text-align: center;
        }

        @media (max-width: 950px) {
            .offer-list {

            }

        @media (max-width: 650px) {
            .offers-page {
                padding: 40px 20px 60px;
            }

            .offers-heading h1 {

            }

            .offer-list {

                grid-column: span 1;
                flex-direction: column;
                align-items: flex-start;
            }

            }
        }

function todayOnly() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function dateOnly(value) {
    const parts = value.split("-");
    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
}

function isActive(start, end) {
    const today = todayOnly();
    return today >= dateOnly(start) && today <= dateOnly(end);
}

function formatDate(value) {
    return dateOnly(value).toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

let messageTimer;

function showMessage(text) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = "block";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(function() {
        box.style.display = "none";
    }, 2800);
}

function showTodayStatus() {
    const activeOffers = offers.filter(function(offer) {
        return isActive(offer.start, offer.end);
    });

    const box = document.getElementById("todayStatus");

    if (activeOffers.length > 0) {
        box.className = "today-status";
        box.textContent = "🎉 Active today: " +
            activeOffers.map(function(offer) {
                return offer.icon + " " + offer.title;
            }).join(" • ");
    } else {
        box.className = "today-status none";
        box.textContent =
            "📅 No festival offer is active today. Check the dates below for upcoming offers.";
    }
}

function getCouponForOffer(offer) {
    return coupons.find(function(coupon) {
        return coupon.start === offer.start &&
               coupon.end === offer.end;
    });
}

function displayOffers() {
    const list = document.getElementById("offerList");

    list.innerHTML = offers.map(function(offer) {
        const active = isActive(offer.start, offer.end);
        const coupon = getCouponForOffer(offer);

        return `
            <div class="offer-box">
                <div class="offer-icon">${offer.icon}</div>
                <div class="offer-type">${offer.type}</div>
                <h2>${offer.title}</h2>
                <p>${offer.desc}</p>

                <div class="offer-discount">${offer.discount}</div>

                <span class="status ${active ? "active" : "inactive"}">
                    ${active ? "ACTIVE NOW" : "UPCOMING / EXPIRED"}
                </span>

                <div class="dates">
                    📅 <b>Valid:</b>
                    ${formatDate(offer.start)} – ${formatDate(offer.end)}
                </div>

                <div class="services">
                    <b>Applicable:</b> ${offer.services}
                </div>

                ${coupon ? `
                    <div class="coupon-box">
                        🎟 Coupon: <b>${coupon.code}</b><br>
                        ${coupon.amount}% OFF
                        • ${coupon.service}
                        • Minimum booking ₹${coupon.minimum}
                    </div>
                ` : ""}

                <div class="button-row">
                    <button
                        ${active ? "" : "disabled"}
                        onclick="applyOffer('${offer.id}')">
                        Apply Offer
                    </button>

                    ${coupon ? `
                        <button
                            class="secondary"
                            ${active && isActive(coupon.start, coupon.end) ? "" : "disabled"}
                            onclick="applyCoupon('${coupon.code}')">
                            Use Coupon
                        </button>
                    ` : `
                        <button class="secondary" disabled>
                            No Coupon
                        </button>
                    `}
                </div>
            </div>
        `;
    }).join("");

    list.innerHTML += `
        <div class="offer-box extra-offer">
            <div>
                <h2>🌍 More Ways to Save on Travel</h2>
                <p>
                    Choose an active festival offer or an eligible coupon.
                    Discounts depend on the offer dates, service and minimum booking value.
                </p>
            </div>
            <div class="extra-icon">🎒✈️</div>
        </div>
    `;
}

function applyOffer(id) {
    const offer = offers.find(function(item) {
        return item.id === id;
    });

    if (!offer || !isActive(offer.start, offer.end)) {
        showMessage("This offer is not active today.");
        return;
    }

    localStorage.setItem("traveloraOffer", JSON.stringify({
        id: offer.id,
        title: offer.title,
        amount: offer.amount,
        discountType: "percentage",
        start: offer.start,
        end: offer.end
    }));

    localStorage.removeItem("traveloraCoupon");

    showMessage(offer.title + " selected — " + offer.amount + "% OFF!");

    setTimeout(function() {
        window.location.href = "booking.html";
    }, 700);
}

function applyCoupon(code) {
    const coupon = coupons.find(function(item) {
        return item.code === code;
    });

    if (!coupon || !isActive(coupon.start, coupon.end)) {
        showMessage("This coupon is not valid today.");
        return;
    }

    localStorage.setItem("traveloraCoupon", JSON.stringify({
        code: coupon.code,
        amount: coupon.amount,
        discountType: "percentage",
        service: coupon.service,
        minimum: coupon.minimum,
        start: coupon.start,
        end: coupon.end
    }));

    localStorage.removeItem("traveloraOffer");

    showMessage("Coupon " + coupon.code + " selected — " + coupon.amount + "% OFF!");

    setTimeout(function() {
        window.location.href = "booking.html";
    }, 700);
}
